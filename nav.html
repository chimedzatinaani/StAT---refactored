<header class="bg-indigo-600 text-white shadow p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-id-card-clip text-xl"></i>
            <h1 class="text-lg font-bold">StAT</h1>
        </div>
        
        <!-- Admin-only Nav -->
        <div id="admin-nav" class="hidden flex items-center gap-4">
            <button onclick="switchView('nfc')" class="text-xs font-bold hover:text-indigo-200">NFC</button>
            <button onclick="switchView('db')" class="text-xs font-bold hover:text-indigo-200">Logs</button>
            <button onclick="adminLogout()" class="text-xs font-bold text-rose-300 hover:text-rose-100">Logout</button>
        </div>

        <div class="flex items-center gap-3">
            <div id="admin-badge" class="hidden items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-200">
                <i class="fa-solid fa-user-shield"></i> Admin
            </div>
            <button onclick="openAdminLogin()" id="admin-login-btn" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 transition cursor-pointer">
                <i class="fa-solid fa-lock mr-1"></i> Admin Login
            </button>
        </div>
    </div>
</header>
